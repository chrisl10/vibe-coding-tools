# SBOM Generation + Sigstore Attestation for @deeplake/hivemind
# Trigger: on tag push (release artifacts only, not every commit)
# Source: guides/07-bind-sbom-to-release-artifact.md and references/research/release-evidence/digest.md
# Retained illustrative versions: review action SHAs, current actions/attest migration,
# schema/coverage policy and target release authorization before adapting.
# This template is not installed CI and does not publish a package.

name: SBOM

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read
  id-token: write        # Required for Sigstore/OIDC attestation
  attestations: write    # Required for actions/attest-sbom

jobs:
  sbom:
    name: Generate and Attest SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22          # package.json engines: node >=22

      # Step 1: Reproducible install + build, then pack the tarball that the
      # `files` allowlist actually ships. Generate the SBOM from THIS, not the
      # source tree - otherwise it lists devDependencies that never publish.
      - name: Install, build, pack
        id: pack
        run: |
          npm ci
          npm run build
          mkdir -p release sbom-src
          npm pack --pack-destination release --json > pack-result.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync('pack-result.json', 'utf8'));
          if (rows.length !== 1 || typeof rows[0].filename !== 'string' ||
              !/^[A-Za-z0-9._-]+\.tgz$/.test(rows[0].filename)) {
            throw new Error('Expected exactly one local release tarball');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `artifact=release/${rows[0].filename}\n`);
          NODE
          tar -xzf "release/$(node -p "JSON.parse(require('fs').readFileSync('pack-result.json','utf8'))[0].filename")" -C sbom-src
        shell: bash

      # Step 2: Generate CycloneDX JSON; record actual emitted schema/version.
      # Metadata discovery may miss bundled/minified code; reconcile coverage.
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./sbom-src/package
          format: cyclonedx-json
          output-file: deeplake-hivemind-sbom.cdx.json
          artifact-name: sbom-${{ github.ref_name }}.cdx.json

      # Step 3: Parse/count sanity only. Schema and coverage gates must be supplied
      # from the target's existing tools before treating this as release-qualified.
      - name: Verify SBOM
        run: |
          COMPONENT_COUNT=$(node -e "console.log((require('./deeplake-hivemind-sbom.cdx.json').components || []).length)")
          echo "SBOM component count: $COMPONENT_COUNT"
          if [ "$COMPONENT_COUNT" -lt 1 ]; then
            echo "ERROR: SBOM has 0 components - generation likely failed"
            exit 1
          fi
        shell: bash

      # Step 4: Attest the SBOM with Sigstore (GitHub OIDC-backed, no keys)
      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: ${{ steps.pack.outputs.artifact }}
          sbom-path: deeplake-hivemind-sbom.cdx.json

      # Step 5: Keep the SBOM as a release artifact (extend retention for compliance)
      - name: Upload SBOM as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            deeplake-hivemind-sbom.cdx.json
            ${{ steps.pack.outputs.artifact }}
            pack-result.json
          retention-days: 90    # Example only; verify target policy and repository limits
